# Cliente web de CircleGuard: sirve el bundle estático y hace de reverse proxy hacia
# los microservicios, para que el navegador solo hable con este origen.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con proxy_pass por variable, el nombre se resuelve en cada
    # petición y no al arrancar: nginx inicia aunque los backends todavía no existan
    # (si no, falla con "host not found in upstream") y detecta contenedores recreados.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Las redirecciones son relativas: el puerto interno 8080 no es el que ve el usuario.
    absolute_redirect off;

    # Igual al límite por defecto de Spring (max-request-size = 10 MB). El valor por
    # defecto de nginx (1 MB) rechazaría con 413 subidas que el backend sí acepta.
    client_max_body_size 10m;

    # $http_host conserva el puerto, $host no. Spring compara Origin con Host para decidir
    # si una petición es CORS: sin el puerto, un POST del mismo origen en un puerto
    # distinto de 80 se trataría como CORS y auth, identity y promotion responderían 403.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Cada location quita el prefijo /svc/<x> y reenvía al servicio del docker-compose.
    # El orden importa: "set" va antes de "rewrite" porque "break" corta las directivas
    # siguientes del módulo rewrite, y $backend quedaría vacío.
    location /svc/auth/ {
        set $backend auth-service:8180;
        rewrite ^/svc/auth/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/identity/ {
        set $backend identity-service:8083;
        rewrite ^/svc/identity/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/promotion/ {
        set $backend promotion-service:8088;
        rewrite ^/svc/promotion/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/notification/ {
        set $backend notification-service:8082;
        rewrite ^/svc/notification/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/form/ {
        set $backend form-service:8086;
        rewrite ^/svc/form/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/file/ {
        set $backend file-service:8085;
        rewrite ^/svc/file/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/gateway/ {
        set $backend gateway-service:8087;
        rewrite ^/svc/gateway/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /svc/dashboard/ {
        set $backend dashboard-service:8084;
        rewrite ^/svc/dashboard/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    # SPA: web.output es "static", así que /login existe como /login.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
