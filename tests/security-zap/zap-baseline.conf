# Reglas del escaneo OWASP ZAP baseline (CG-92). Formato de ZAP: id<TAB>nivel<TAB>(nombre).
# FAIL   = bloquea el pipeline: la versión no se promueve a stage.
#          Vulnerabilidades reales: librerías JS vulnerables, cookies sin HttpOnly,
#          fuga de errores de depuración, código fuente o PII, CORS mal configurado,
#          autenticación débil, contenido mixto.
# WARN   = queda en el reporte pero no bloquea: encabezados de endurecimiento
#          (CSP, X-Frame-Options, X-Content-Type-Options...) que se corrigen en nginx.
# IGNORE = no aplica:
#          10035: sin TLS en los ambientes de la Parte 1/2 sin certificado; TLS es otra historia (E2.6)
#          10116: aviso de versión de ZAP, no es un hallazgo de la app
#          10109: informativo: solo indica que es una SPA
#          10096: ruido: los bundles de JS minificados contienen números parecidos a timestamps
# Cambiar un nivel es un cambio revisable en el PR como cualquier otro.
