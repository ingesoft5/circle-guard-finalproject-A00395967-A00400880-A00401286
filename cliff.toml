# Configuración de git-cliff para CircleGuard (CG-28)
# Repositorio: https://github.com/ingesoft5/circle-guard-finalproject-A00395967-A00400880-A00401286

[changelog]
header = """
# Notas de Lanzamiento - CircleGuard\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} - ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ingesoft5/circle-guard-finalproject-A00395967-A00400880-A00401286/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- Generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Funcionalidades (Features)" },
  { message = "^fix", group = "<!-- 1 -->🐛 Corrección de Errores (Bug Fixes)" },
  { message = "^perf", group = "<!-- 2 -->⚡ Rendimiento (Performance)" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactorización (Refactor)" },
  { message = "^build", group = "<!-- 4 -->📦 Sistema de Compilación (Build)" },
  { message = "^docs", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
