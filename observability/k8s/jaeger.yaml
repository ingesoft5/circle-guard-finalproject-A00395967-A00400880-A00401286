# Jaeger (CG-96) en modo todo-en-uno con almacenamiento en memoria: recibe las
# trazas por OTLP/HTTP (4318) y sirve la interfaz (16686).
# Los servicios exportan a http://jaeger-collector.observability:4318/v1/traces
# (variable OTEL_EXPORTER_OTLP_TRACES_ENDPOINT en el chart de la app).
# Limitación aceptada: al reiniciarse el pod se pierden las trazas guardadas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: {app.kubernetes.io/name: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /, port: ui}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
