spring:
  profiles:
    active: test
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

vault:
  secret: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536" # hex for "test-secret-..."
  salt: "deadbeef"      # hex for encryption
  hash-salt: "12345678" # hex for hashing

# El application.yml de pruebas reemplaza al principal, así que también debe
# definir jwt.secret. Sin esto, JwtAuthenticationFilter recibe el texto literal
# "${jwt.secret}" (13 bytes = 104 bits) y jjwt lo rechaza por ser < 256 bits.
jwt:
  secret: "test-only-jwt-secret-with-at-least-32-bytes!!"
