spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  expiration: 300000 # milisegundos (5 minutos)

circleguard:
  features:
    strict-gate:
      # Feature Toggle: si es true, niega el ingreso a quien no tenga estado en Redis.
      # Variable de entorno: CIRCLEGUARD_FEATURES_STRICT_GATE_ENABLED
      enabled: false

server:
  port: 8087

management:
  # Métricas para Prometheus (CG-93): /actuator/prometheus, con la etiqueta
  # application para separar servicios e histogramas para calcular el p95.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, redis
