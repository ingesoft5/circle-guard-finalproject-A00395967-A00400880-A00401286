spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_promotion
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  kafka:
    bootstrap-servers: localhost:9092
    # Sin esto el KafkaTemplate usa StringSerializer y cada send() de un Map falla con
    # SerializationException: promotion.status.changed, alert.priority y circle.fenced
    # nunca salían. notification-service los lee como texto JSON (StringDeserializer).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8088

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000
