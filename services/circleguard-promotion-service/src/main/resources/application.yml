spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_promotion
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  kafka:
    # Trazas (CG-96): el contexto viaja en las cabeceras del mensaje (traceparent).
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: localhost:9092
    # Sin esto el KafkaTemplate usa StringSerializer y cada send() de un Map falla con
    # SerializationException: promotion.status.changed, alert.priority y circle.fenced
    # nunca salían. notification-service los lee como texto JSON (StringDeserializer).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8088

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

management:
  # Trazas (CG-96): todas las peticiones se trazan (volumen bajo) y se exportan
  # por OTLP/HTTP a Jaeger. En Kubernetes se apunta al collector con la variable.
  # Spring Boot agrega [traceId-spanId] a cada línea de log (correlación con Loki).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Métricas para Prometheus (CG-93): /actuator/prometheus, con la etiqueta
  # application para separar servicios e histogramas para calcular el p95.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db, neo4j
